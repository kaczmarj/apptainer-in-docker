name: Docker Image CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v3

    - name: Get short SHA-1
      id: vars
      run: echo "git_hash_short=$(git rev-parse --short $GITHUB_SHA)" >> $GITHUB_OUTPUT

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the Docker image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/apptainer-in-docker:latest \
                     -t ghcr.io/${{ github.repository_owner }}/apptainer-in-docker:${{ steps.vars.outputs.git_hash_short }} .

    - name: Test the Docker image (print Apptainer version)
      run: docker run --rm ghcr.io/${{ github.repository_owner }}/apptainer-in-docker:latest version

    - name: Push the Docker image
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/apptainer-in-docker:latest
        docker push ghcr.io/${{ github.repository_owner }}/apptainer-in-docker:${{ steps.vars.outputs.git_hash_short }}
